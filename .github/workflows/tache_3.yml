name: Tache_3

on:
  push:
  pull_request:

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: 22

defaults:
  run:
    shell: bash
    

jobs:
  test:
    name: Compile and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: ["-XX:SurvivorRatio=4", "-XX:+PrintClassHistogram", "-XX:CompilationMode='quick-only'"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          
      - name: Build the 5 differents flags with strategy.matrix
        run: |
          export MAVEN_OPTS=${{ matrix.flag }}
          echo "###############################"
          echo "the current flag being used " $MAVEN_OPTS
          echo "###############################"
          xvfb-run mvn -B verify -Djavafx.platform=linux jacoco:report -Pcoverage
          unset MAVEN_OPTS  
      - name: Get JaCoCo Coverage
        id: coverage  
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv) 
          echo "COVERAGE=$coverage" >> $GITHUB_ENV
      - name: Fail if coverage has not improved.
        run: |
          coverage=$COVERAGE
          threshold=13.43
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then
            echo "Coverage has not improved."
            exit 1
          else
            echo "New coverage: $coverage%"
          fi

      - name: Ending message
        run: |
          sudo apt-get install cowsay -y
          sudo apt-get install lolcat -y
          cowsay "Tous les tests sont finis c'est meuuhhveilleux!!!!" | lolcat
