name: Tache_3

on:
  push:
  pull_request:

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: 22

defaults:
  run:
    shell: bash
    

jobs:
  test:
    name: Compile and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          
      - name: Buid first flag
        uses: Best-Quality-Engineering/ci-maven-action@v1
        with:
          maven-opts: -XX:+ExtensisveErrorReports
          run: |
          
            xvfb-run java -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version
            xvfb-run mvn verify -Pcoverage
